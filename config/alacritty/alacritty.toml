[font]
normal = { family = "FiraCodeNerdFontMono", style = "Regular" }
size = 14.0

[cursor]
style = { shape = "Beam" }
vi_mode_style = { shape = "Block" }
thickness = 0.225

[mouse]
hide_when_typing = true

[keyboard]
# Code from omarchy
# https://github.com/basecamp/omarchy/blob/quattro/config/alacritty/alacritty.toml
bindings = [
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  # Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
  { key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
  # Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
  { key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" }
]

[general]
import = [
  "~/.local/share/dotfiles/themes/current/alacritty.toml",
  "~/.local/share/dotfiles/local/alacritty.toml"
]
